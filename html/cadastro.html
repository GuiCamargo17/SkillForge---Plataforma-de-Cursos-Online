        <main>
            <h2>Criar uma conta</h2>
            <form >
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" placeholder="" required><br><br>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" placeholder="" required><br><br>
                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" name="senha" placeholder=" " required><br><br>
                <label for="confirma-senha">Confirmar Senha:</label><br>
                <input type="password" id="confirma-senha" name="confirma-senha" placeholder="" required><br><br>
                <label for="data">Data:</label><br>
                <input type="date" id="data" name="data" required><br><br>
                <label >
                <input type="checkbox" required>
                Aceitar os Termos de Uso
                </label><br><br>

                <input type="submit" value="Criar Conta"><br>
            </form>

        </main>
