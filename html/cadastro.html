<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Cadastro | SkillForge</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
     
    <header>

        <h1>SkillForge</h1>
        
        <nav  class="menu">   
         <a href="index.html">Home</a> 
        <a href="cursos.html">Cursos</a> 
        <a href="sobre.html">Sobre</a> 
        <a href="contato.html">Contato</a> 
        <a href="perfil.html">Perfil</a> 
        <a href="fag.html">Fag</a> 
        <a href="login.html">Login</a>

        </nav>
        </header>

        

        <main class="pagina-cadastro">

            <section class="cadastro-container">
            <h2>Criar uma conta</h2>
            <p>Comece sua jornada de aprendizado na SkillForge</p>
            <form  class="form-cadastro">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="" required>
        
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="" required>
               
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder=" " required>
                <label for="confirma-senha">Confirmar Senha:</label>
                <input type="password" id="confirma-senha" name="confirma-senha" placeholder="" required>
               
          <div class="cadastro-termos">
               
             <label>
            <input type="checkbox" name="termos" required>
                Aceito os termos de uso e a política de privacidade.
                </label>

                </div>
                
                <button type="submit">Criar Conta</button>
            </form>

            <div class="cadastro-login ">
                <p>Já possui uma conta?</p>
                 <a href="login.html">Fazer Login</a>
            </div>

            </section>

        </main>

      
      

    <footer>
        <p>©2026 SkillForge. Todos os direitos reservados.</p>
    </footer>

    
</body>
</html>
