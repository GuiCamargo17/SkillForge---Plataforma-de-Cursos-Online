<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkillForge</title>
        <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>

     <header>

        <h1>SkillForge</h1>
        
        <nav  class="menu">   
         <a href="index.html">Home</a> 
        <a href="cursos.html">Cursos</a> 
        <a href="sobre.html">Sobre</a> 
        <a href="contato.html">Contato</a> 
        <a href="perfil.html">Perfil</a> 
        <a href="fag.html">Fag</a> 
        <a href="login.html">Login</a>

        </nav>
        </header>

   

    <main class="pagina-login">
        <section class="login-container">
        <h2>Bem-vindo de volta!</h2>

        <p>Acesse a sua conta e continue aprendendo.</p>

        <form class="form-login">
            
            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email" placeholder="Digite Seu E-mail" required>
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" placeholder="Digite Sua Senha" required>
           
           <div class="login-opcoes">
            <label class="lembrar" >
                 <input type="checkbox" name="lembrar" id="lembrar">
                 Lembrar-me
            </label>

              <a href="recuperar-senha.html">Esqueceu a senha</a>

              </div>
           

           <button type="submit" class="botao">
            Entrar
           </button>
        </form>

        <p class="login-cadastro">
            Ainda não possui uma conta?

             <a href="cadastro.html">Criar Conta</a>

        </p>

        </section>

        
          


        
    </main>

     <footer>
        <p>©2026 SkillForge. Todos os direitos reservados.</p>
    </footer>

    
</body>
</html>
